aid: deliverart
name: Deliverart
description: >-
  Deliverart is food-delivery management software for restaurants and delivery businesses, founded in
  Italy and backed by Techstars. It centralizes orders from Just Eat, Glovo, Deliveroo, a restaurant's
  own website and phone into a single interface; synchronizes menus across sales channels; and manages
  riders, delivery routing, take-away, the Delivery Order Display System (DODS) and live tracking. The
  public Deliverart API is an RPC-style HTTPS API (GET for reads, POST for writes) covering orders,
  menu, customers, points of sale, workshifts, deliveries and reservations, with API key and OAuth2
  authentication. Deliverart also ships a modular first-party JavaScript SDK suite on npm.
